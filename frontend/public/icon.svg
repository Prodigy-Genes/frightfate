<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="night" x2="0" y2="1">
      <stop stop-color="#1c1712"/>
      <stop offset="1" stop-color="#070706"/>
    </linearGradient>
    <linearGradient id="fate" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f0d8bb"/>
      <stop offset="1" stop-color="#a4937d"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Case-file seal, kept deliberately bold at tab-icon sizes. -->
  <rect x="2" y="2" width="60" height="60" rx="11" fill="url(#night)" stroke="#756552" stroke-width="1.4"/>
  <path d="M8 15V8h7M49 8h7v7M8 49v7h7m34 0h7v-7" fill="none" stroke="#a78d69" stroke-width="1.4"/>
  <circle cx="32" cy="29" r="20" fill="none" stroke="#a78d69" stroke-opacity=".48" stroke-width="1"/>
  <circle cx="32" cy="29" r="15.5" fill="#0b0a08" stroke="#d1b58e" stroke-width="1.5"/>
  <!-- The open door / F-shaped monogram: one stroke is both threshold and fate. -->
  <path d="M24 43V17h18M24 27h14" fill="none" stroke="url(#fate)" stroke-width="3.2" stroke-linecap="square" stroke-linejoin="round"/>
  <path d="M42 17v26" fill="none" stroke="#d7b783" stroke-width="2.4" filter="url(#glow)"/>
  <path d="M42 43c0-5 5-7 5-12 0-3-2-5-5-5" fill="none" stroke="#d7b783" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="42" cy="17" r="2.3" fill="#f0d8bb" filter="url(#glow)"/>
  <!-- Three decision marks and a final record tick. -->
  <path d="M17 50h30M20 53h2m5 0h2m5 0h2m5 0h2m5 0h2" stroke="#8d7656" stroke-width="1"/>
  <circle cx="32" cy="8" r="1.3" fill="#d5b68c"/>
  <circle cx="56" cy="32" r="1.3" fill="#d5b68c"/>
  <circle cx="8" cy="32" r="1.3" fill="#d5b68c"/>
</svg>
