<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="FrightFate">
  <defs>
    <radialGradient id="bg" cx="50%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#2a0a12"/>
      <stop offset="55%" stop-color="#120509"/>
      <stop offset="100%" stop-color="#050203"/>
    </radialGradient>
    <linearGradient id="bone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4efe6"/>
      <stop offset="60%" stop-color="#cfc4b6"/>
      <stop offset="100%" stop-color="#8f8478"/>
    </linearGradient>
    <radialGradient id="eye" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#fff0f0"/>
      <stop offset="35%" stop-color="#ff3b3b"/>
      <stop offset="100%" stop-color="#8b0000"/>
    </radialGradient>
    <linearGradient id="drip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff2d3f"/>
      <stop offset="100%" stop-color="#8b0000"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
  </defs>

  <!-- Badge -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="15" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="15" fill="none" stroke="#dc143c" stroke-opacity="0.55" stroke-width="1.6"/>

  <!-- Fate seal ring: ticks around the skull -->
  <g stroke="#dc143c" stroke-width="1.4" stroke-linecap="round" opacity="0.75">
    <path d="M32 5.5v3.2"/>
    <path d="M32 55.3v3.2"/>
    <path d="M5.5 32h3.2"/>
    <path d="M55.3 32h3.2"/>
    <path d="M13.3 13.3l2.3 2.3" opacity="0.7"/>
    <path d="M48.4 48.4l2.3 2.3" opacity="0.7"/>
    <path d="M50.7 13.3l-2.3 2.3" opacity="0.7"/>
    <path d="M15.6 48.4l-2.3 2.3" opacity="0.7"/>
  </g>

  <!-- Crimson aura behind the skull -->
  <circle cx="32" cy="28" r="17" fill="#dc143c" opacity="0.35" filter="url(#softglow)"/>

  <!-- Skull -->
  <g filter="url(#glow)">
    <path d="M32 9c-9.7 0-16 6.6-16 15.4 0 4.6 1.7 8 4.4 10.4v3.7c0 1.6 1.3 2.9 2.9 2.9h1.3v2.6c0 1.6 1.3 2.9 2.9 2.9h9c1.6 0 2.9-1.3 2.9-2.9v-2.6h1.3c1.6 0 2.9-1.3 2.9-2.9v-3.7c2.7-2.4 4.4-5.8 4.4-10.4C48 15.6 41.7 9 32 9z"
      fill="url(#bone)"/>
    <!-- Eye sockets -->
    <ellipse cx="25.6" cy="24.6" rx="4.7" ry="5.2" fill="#0a0405"/>
    <ellipse cx="38.4" cy="24.6" rx="4.7" ry="5.2" fill="#0a0405"/>
    <!-- Glowing eyes -->
    <ellipse cx="25.6" cy="24.8" rx="3" ry="3.2" fill="url(#eye)" filter="url(#glow)"/>
    <ellipse cx="38.4" cy="24.8" rx="3" ry="3.2" fill="url(#eye)" filter="url(#glow)"/>
    <!-- Nose -->
    <path d="M32 29.4l-2.6 4.6h5.2z" fill="#0a0405"/>
  </g>

  <!-- Jaw / teeth -->
  <g>
    <path d="M22.6 39.2h18.8v3.4c0 1.5-1.2 2.7-2.7 2.7H25.3c-1.5 0-2.7-1.2-2.7-2.7z" fill="#cfc4b6"/>
    <g stroke="#0a0405" stroke-width="1.1" opacity="0.85">
      <path d="M27.4 39.4v5.7"/>
      <path d="M32 39.4v5.7"/>
      <path d="M36.6 39.4v5.7"/>
    </g>
  </g>

  <!-- Blood drip -->
  <path d="M32 46.4c1.9 2.7 3.1 4.6 3.1 6.2a3.1 3.1 0 0 1-6.2 0c0-1.6 1.2-3.5 3.1-6.2z" fill="url(#drip)" filter="url(#glow)"/>
  <circle cx="32" cy="58.4" r="1" fill="#ff2d3f" opacity="0.9"/>
</svg>
