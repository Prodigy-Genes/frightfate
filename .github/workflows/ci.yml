name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Lint & Import Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn sqlalchemy pydantic pydantic-settings openai websockets python-dotenv
      - name: Test backend import
        run: |
          cd backend
          python -c "import app.main; print('Backend loaded successfully')"

  frontend-build:
    name: Frontend Bun Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: |
          cd frontend
          bun install --frozen-lockfile
      - name: Typecheck frontend
        run: |
          cd frontend
          bun run typecheck
      - name: Build frontend
        run: |
          cd frontend
          bun run build
