services:
  - type: web
    name: frightfate-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    # Single worker: lobby presence, the Fate Feed and WebSocket routing are
    # in-process - multiple workers would split rooms across processes.
    startCommand: "python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        value: sqlite:///./frightfate.db
      # AI provider (OpenAI-compatible: Groq, OpenAI, DeepSeek, ...)
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_API_KEY_2
        sync: false
      - key: OPENAI_BASE_URL
        value: "https://api.groq.com/openai/v1"
      - key: OPENAI_MODEL
        value: "openai/gpt-oss-120b"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ENVIRONMENT
        value: production

  - type: web
    name: frightfate-frontend
    env: node
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: "bun install && bun run build"
    startCommand: "bun run start"
    healthCheckPath: /
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
